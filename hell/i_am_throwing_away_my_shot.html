<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Stigmatizers MK1.</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#000}
  body{
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    color:#fff;
    cursor:grab;
  }
  body.dragging{cursor:grabbing}

  canvas#scene{
    position:fixed; inset:0; width:100%; height:100%;
    display:block; touch-action:none;
  }

  .ui{
    position:fixed; inset:0; z-index:3;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:clamp(22px,3.4vw,48px);
    pointer-events:none;
    user-select:none;
  }

  .top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:24px;
  }

  .title{
    font-size:clamp(14px,1.5vw,19px);
    font-weight:400;
    letter-spacing:.01em;
    line-height:1.2;
  }

  .spec{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:9px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#6a6a72;
    text-align:right;
    line-height:1.9;
    max-width:340px;
  }
  .spec .warn{color:#8f8f98}
  .spec .tag{color:#4d6bfe;text-decoration:none}

  .bottom{
    display:flex; justify-content:space-between; align-items:flex-end; gap:24px;
  }

  .by{
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#7a7a80;
  }

  .sent{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#7a7a80;
    text-align:right;
    white-space:nowrap;
  }

  @media (max-width:640px){
    .spec{font-size:8px; letter-spacing:.12em; max-width:200px}
    .title{font-size:13px}
  }
  @media (max-width:560px){
    .bottom{flex-direction:column; align-items:flex-start; gap:10px}
    .sent{text-align:left; font-size:9px}
    .by{font-size:9px}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="ui">
  <div class="top">
    <div class="title">Stigmatizers MK1.</div>
    <div class="spec">
      Constant Neural Video Feed Glasses<br>
      <span class="warn">(May affect future vision)</span><br>
      <a class="tag" href="group_chat.html">Untested</a>
    </div>
  </div>

  <div class="bottom">
    <div class="by">made by WCT</div>
    <div class="sent">4 copies sent to B00</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------- setup */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(0, 0.18, 7.6);
camera.lookAt(0, 0, 0);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(5, 7, 6);
scene.add(key);

const rim = new THREE.DirectionalLight(0x9fb2ff, 1.8);
rim.position.set(-7, -3, -5);
scene.add(rim);

/* ------------------------------------------------------------- materials */
const matFrame = new THREE.MeshPhysicalMaterial({
  color: 0x121216, metalness: 0.9, roughness: 0.3,
  clearcoat: 0.7, clearcoatRoughness: 0.28, envMapIntensity: 1.15
});

const matMetal = new THREE.MeshPhysicalMaterial({
  color: 0x1c1c22, metalness: 1, roughness: 0.22, envMapIntensity: 1.3
});

const matDark = new THREE.MeshPhysicalMaterial({
  color: 0x050507, metalness: 0.35, roughness: 0.12, envMapIntensity: 1.6
});

const matPupil = new THREE.MeshPhysicalMaterial({
  color: 0x0a1030, metalness: 0.9, roughness: 0.06,
  emissive: 0x1b2a7a, emissiveIntensity: 0.5, envMapIntensity: 1.8
});

const matAccent = new THREE.MeshStandardMaterial({
  color: 0x4d6bfe, emissive: 0x2a44ff, emissiveIntensity: 0.7,
  metalness: 0.6, roughness: 0.25
});

const matLens = new THREE.MeshPhysicalMaterial({
  color: 0xcfd9ff, metalness: 0, roughness: 0.05,
  transparent: true, opacity: 0.2, depthWrite: false,
  envMapIntensity: 2.4, side: THREE.DoubleSide
});

/* ------------------------------------------------------------- geometry */
const LENS_W = 1.46, LENS_H = 1.12, CORNER = 0.40, THICK = 0.09;
const CX = 0.80;

function roundedRect(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0, false);
  s.lineTo(x + w, y + h - r);
  s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2, false);
  s.lineTo(x + r, y + h);
  s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(x, y + r);
  s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5, false);
  return s;
}

const glasses = new THREE.Group();

/* frames */
const frameShape = roundedRect(LENS_W, LENS_H, CORNER);
frameShape.holes.push(roundedRect(LENS_W - 2 * THICK, LENS_H - 2 * THICK, CORNER - THICK));

const frameGeo = new THREE.ExtrudeGeometry(frameShape, {
  depth: 0.10, bevelEnabled: true, bevelThickness: 0.02,
  bevelSize: 0.016, bevelSegments: 3, curveSegments: 40
});
frameGeo.translate(0, 0, -0.05);

[-CX, CX].forEach(x => {
  const f = new THREE.Mesh(frameGeo, matFrame);
  f.position.x = x;
  glasses.add(f);
});

/* lenses */
const lensGeo = new THREE.ShapeGeometry(
  roundedRect(LENS_W - 2 * THICK - 0.006, LENS_H - 2 * THICK - 0.006, CORNER - THICK - 0.003), 40
);
[-CX, CX].forEach(x => {
  const l = new THREE.Mesh(lensGeo, matLens);
  l.position.x = x;
  glasses.add(l);
});

/* camera modules */
function cameraModule() {
  const g = new THREE.Group();

  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.100, 0.112, 0.11, 48, 1, true), matMetal);
  barrel.rotation.x = Math.PI / 2;
  barrel.position.z = 0.03;
  g.add(barrel);

  const face = new THREE.Mesh(new THREE.CircleGeometry(0.098, 48), matDark);
  face.position.z = 0.086;
  g.add(face);

  const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.054, 40), matPupil);
  pupil.position.z = 0.088;
  g.add(pupil);

  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.079, 0.0055, 8, 56), matAccent);
  ring.position.z = 0.090;
  g.add(ring);

  const glint = new THREE.Mesh(
    new THREE.CircleGeometry(0.011, 16),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 })
  );
  glint.position.set(-0.028, 0.028, 0.092);
  g.add(glint);

  return g;
}

[[1.20, 0.22], [-1.20, 0.22]].forEach(([x, y]) => {
  const m = cameraModule();
  m.position.set(x, y, 0.0);
  glasses.add(m);
});

/* bridge */
const bridgeCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.14, 0.34, 0),
  new THREE.Vector3(-0.07, 0.41, 0),
  new THREE.Vector3(0.00, 0.425, 0),
  new THREE.Vector3(0.07, 0.41, 0),
  new THREE.Vector3(0.14, 0.34, 0)
]);
glasses.add(new THREE.Mesh(new THREE.TubeGeometry(bridgeCurve, 56, 0.030, 12, false), matFrame));

/* temples */
function temple(sign) {
  const pts = [
    new THREE.Vector3(sign * 1.50, 0.30, 0.00),
    new THREE.Vector3(sign * 1.60, 0.29, -0.45),
    new THREE.Vector3(sign * 1.63, 0.20, -1.10),
    new THREE.Vector3(sign * 1.57, -0.05, -1.75),
    new THREE.Vector3(sign * 1.50, -0.30, -2.05)
  ];
  const curve = new THREE.CatmullRomCurve3(pts);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 72, 0.026, 10, false), matFrame);
  const hinge = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.11), matFrame);
  hinge.position.set(sign * 1.505, 0.30, -0.02);
  return [mesh, hinge];
}
glasses.add(...temple(1), ...temple(-1));

/* shift contents so the visual centre sits on the pivot */
glasses.children.forEach(c => { c.position.z += 1.0; });

const rig = new THREE.Group();
rig.add(glasses);
scene.add(rig);

/* ------------------------------------------------------------ interaction */
let dragging = false, lastX = 0, lastY = 0;
let targetY = -0.42, targetX = 0.08;
let curY = targetY, curX = targetX;

canvas.addEventListener('pointerdown', e => {
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  document.body.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  targetY += (e.clientX - lastX) * 0.0065;
  targetX = THREE.MathUtils.clamp(targetX + (e.clientY - lastY) * 0.005, -0.6, 0.75);
  lastX = e.clientX; lastY = e.clientY;
});

function endDrag() {
  dragging = false;
  document.body.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

/* ---------------------------------------------------------------- resize */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', resize);
resize();

/* ------------------------------------------------------------------ loop */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();
  const ease = Math.min(1, dt * 6);

  if (!dragging) targetY += 0.14 * dt;

  curY += (targetY - curY) * ease;
  curX += (targetX - curX) * ease;

  rig.rotation.y = curY;
  rig.rotation.x = curX;
  rig.position.y = Math.sin(t * 0.7) * 0.05;

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
