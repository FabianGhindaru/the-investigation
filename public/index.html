<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Do not stay</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: #b30000;
      font-family: "Courier New", monospace;
      text-align: center;
      padding: 1rem;
    }
    h1 {
      font-size: 2.2rem;
      letter-spacing: 0.3em;
      animation: flicker 3s infinite;
    }
    p {
      color: #6b6b6b;
      max-width: 30rem;
      line-height: 1.7;
    }
    .watching {
      color: #b30000;
      animation: fade 6s infinite;
    }
    @keyframes flicker {
      0%, 18%, 22%, 62%, 64%, 100% { opacity: 1; }
      20%, 63% { opacity: 0.15; }
      21% { opacity: 0.7; }
    }
    @keyframes fade {
      0%, 70% { opacity: 0; }
      85%, 100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>YOU SHOULD NOT BE HERE</h1>
  <p>This record was sealed in 1987. Whoever opened it left the door unlocked behind them.</p>
  <p>The last visitor stayed for eleven minutes.</p>
  <p class="watching">We can see that you are still reading.</p>
</body>
</html>
