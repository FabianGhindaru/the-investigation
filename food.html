<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What can I cook?</title>
<style>
  :root{--red:#e60012;--dred:#8a000b;--black:#0a0a0a;--ink:#141414;--white:#fff;--grey:#b8b8b8;
    --display:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Black",sans-serif;
    --body:"Trebuchet MS",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;color:var(--white);font-family:var(--body);line-height:1.45;
    background:
      radial-gradient(circle at 100% 0,rgba(230,0,18,.35) 0,transparent 45%),
      repeating-linear-gradient(135deg,#0d0d0d 0 16px,#080808 16px 32px);
    background-attachment:fixed}
  .wrap{max-width:900px;margin:0 auto;padding:0 14px 40px}

  /* HERO */
  .hero{position:relative;background:var(--red);margin:0 -14px;padding:26px 20px 56px;overflow:hidden;
    clip-path:polygon(0 0,100% 0,100% 80%,6% 100%,0 90%);animation:slide .5s ease-out}
  .hero::before{content:"";position:absolute;inset:0;opacity:.28;
    background:radial-gradient(#000 22%,transparent 23%) 0 0/12px 12px;
    -webkit-mask-image:linear-gradient(100deg,transparent 30%,#000 100%);mask-image:linear-gradient(100deg,transparent 30%,#000 100%)}
  .hero::after{content:"★";position:absolute;right:-10px;top:-24px;font-size:9rem;color:#000;opacity:.25;transform:rotate(18deg)}
  h1{position:relative;margin:0;font-family:var(--display);font-style:italic;text-transform:uppercase;
    font-weight:400;font-size:clamp(2.4rem,10vw,4.4rem);line-height:.95;letter-spacing:.02em;
    transform:rotate(-3deg);transform-origin:left;text-shadow:4px 4px 0 #000,-2px -2px 0 #000}
  .sub{position:relative;display:inline-block;margin:14px 0 0;background:#000;color:#fff;padding:5px 16px;
    transform:skew(-12deg);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.82rem}
  .sub span{display:inline-block;transform:skew(12deg)}

  /* LABELS */
  .label{display:inline-block;margin:26px 0 12px;background:#fff;color:#000;font-family:var(--display);
    font-style:italic;text-transform:uppercase;letter-spacing:.04em;font-size:1.15rem;
    padding:2px 18px 2px 14px;transform:skew(-12deg);box-shadow:5px 5px 0 var(--red)}
  .label span{display:inline-block;transform:skew(12deg)}
  .group{font-family:var(--display);font-style:italic;text-transform:uppercase;color:var(--grey);
    font-size:.85rem;letter-spacing:.08em;margin:16px 0 8px;border-bottom:2px solid var(--red);display:inline-block;padding-right:18px}

  /* CHIPS */
  .chips{display:flex;flex-wrap:wrap;gap:10px 8px}
  .chip{font:inherit;cursor:pointer;color:#fff;background:#000;border:2px solid #fff;padding:7px 14px;
    transform:skew(-9deg);box-shadow:4px 4px 0 var(--red);transition:transform .12s,box-shadow .12s,background .12s}
  .chip>span{display:inline-block;transform:skew(9deg);font-weight:700;font-size:.92rem}
  .chip small{color:var(--grey);font-weight:400;margin-left:5px}
  .chip:hover{transform:skew(-9deg) translate(-2px,-2px);box-shadow:6px 6px 0 var(--red)}
  .chip:active{transform:skew(-9deg) translate(2px,2px);box-shadow:1px 1px 0 var(--red)}
  .chip[aria-pressed="true"]{background:var(--red);border-color:#000;box-shadow:4px 4px 0 #fff}
  .chip[aria-pressed="true"] small{color:#ffd0d4}
  .chip[aria-pressed="true"]>span::before{content:"✔ "}
  .chip:focus-visible,.tab:focus-visible,.btn:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}

  /* BUTTONS & FILTERS */
  .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
  .btn{font:inherit;cursor:pointer;color:#000;background:#fff;border:0;padding:8px 16px;transform:skew(-10deg);
    font-family:var(--display);font-style:italic;text-transform:uppercase;letter-spacing:.04em;box-shadow:4px 4px 0 var(--red)}
  .btn>span{display:inline-block;transform:skew(10deg)}
  .btn:hover{background:var(--red);color:#fff;box-shadow:4px 4px 0 #fff}
  .btn[aria-pressed="true"]{background:var(--red);color:#fff;box-shadow:4px 4px 0 #fff}
  .count{margin-left:auto;font-family:var(--display);font-style:italic;color:var(--red);font-size:1.1rem}
  input[type=search]{flex:1;min-width:160px;font:inherit;color:#fff;background:#000;border:2px solid #fff;
    border-left:8px solid var(--red);padding:9px 12px}
  input::placeholder{color:#888}

  /* TABS */
  .tabs{display:flex;gap:8px;margin:14px 0;position:sticky;top:0;z-index:10;padding:10px 0;
    background:linear-gradient(#080808 75%,transparent)}
  .tab{flex:1;font-family:var(--display);font-style:italic;text-transform:uppercase;letter-spacing:.04em;
    font-size:.95rem;cursor:pointer;color:#fff;background:#000;border:2px solid #fff;padding:10px 4px;
    transform:skew(-10deg);box-shadow:4px 4px 0 var(--red)}
  .tab>span{display:inline-block;transform:skew(10deg)}
  .tab[aria-selected="true"]{background:#fff;color:#000;box-shadow:4px 4px 0 var(--red);border-color:var(--red)}

  /* RECIPE CARDS */
  details{background:var(--ink);border:3px solid #fff;margin:0 8px 16px 0;box-shadow:7px 7px 0 var(--red);
    animation:pop .25s ease-out}
  details[open]{background:#fff;color:#000;border-color:#000;box-shadow:7px 7px 0 var(--red)}
  summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px}
  summary::-webkit-details-marker{display:none}
  .emoji{flex:none;width:54px;height:54px;display:grid;place-items:center;font-size:1.9rem;background:var(--red);
    transform:skew(-10deg);border:2px solid #000;box-shadow:3px 3px 0 #000}
  .emoji span{transform:skew(10deg)}
  .title{font-family:var(--display);font-style:italic;text-transform:uppercase;font-size:1.25rem;line-height:1.05;letter-spacing:.02em}
  .meta{color:var(--grey);font-size:.8rem;margin-top:4px}
  details[open] .meta{color:#555}
  .status{margin-left:auto;flex:none;padding:3px 12px;font-family:var(--display);font-style:italic;text-transform:uppercase;
    font-size:.85rem;transform:skew(-12deg);border:2px solid #000}
  .ok{background:#fff;color:#000;border-color:#fff}
  details[open] .ok{background:#000;color:#fff}
  .miss{background:var(--red);color:#fff;border-color:var(--red)}
  .body{padding:4px 16px 18px;border-top:4px solid var(--red)}
  .body h4{font-family:var(--display);font-style:italic;text-transform:uppercase;letter-spacing:.05em;
    font-size:1rem;margin:16px 0 8px;color:var(--red)}
  .tag{display:inline-block;margin:3px 5px 3px 0;padding:2px 10px;font-size:.82rem;font-weight:700;
    background:#000;color:#fff;transform:skew(-8deg)}
  .tag.no{background:var(--red)}
  .tag.opt{background:#ddd;color:#333;font-weight:400}
  ol{padding-left:0;margin:6px 0;counter-reset:s;list-style:none}
  ol li{counter-increment:s;position:relative;padding:4px 0 8px 44px;min-height:34px}
  ol li::before{content:counter(s);position:absolute;left:0;top:2px;width:32px;height:30px;display:grid;place-items:center;
    background:var(--red);color:#fff;font-family:var(--display);font-style:italic;font-size:1.1rem;transform:skew(-10deg)}
  .tip{margin-top:12px;background:#000;color:#fff;padding:10px 14px;border-left:8px solid var(--red);font-size:.92rem}
  .tip b{color:var(--red);font-family:var(--display);font-style:italic;text-transform:uppercase;letter-spacing:.05em}
  .empty{text-align:center;padding:36px 10px;font-family:var(--display);font-style:italic;font-size:1.2rem;
    color:var(--grey);text-transform:uppercase}
  footer{color:#888;font-size:.78rem;margin:30px 0 0;border-top:2px solid var(--red);padding-top:12px}

  @keyframes slide{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>What can<br>I cook?</h1>
    <div class="sub"><span>Tap what you have. We'll take care of dinner.</span></div>
  </header>

  <div class="label"><span>1 · Your ingredients</span></div>
  <div id="ingredients"></div>
  <div class="row">
    <button class="btn" id="basics"><span>+ Oil &amp; salt</span></button>
    <button class="btn" id="clear"><span>Clear all</span></button>
    <div class="count" id="selcount"></div>
  </div>

  <div class="label"><span>2 · Recipes</span></div>
  <div class="row" style="margin-top:0">
    <input type="search" id="q" placeholder="Search recipes…" aria-label="Search recipes">
    <button class="btn" data-f="any"    aria-pressed="true"><span>Any time</span></button>
    <button class="btn" data-f="fast"   aria-pressed="false"><span>≤ 10 min</span></button>
    <button class="btn" data-f="nocook" aria-pressed="false"><span>No cooking</span></button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="ready"><span></span></button>
    <button class="tab" role="tab" data-tab="almost"><span></span></button>
    <button class="tab" role="tab" data-tab="all"><span></span></button>
  </div>
  <div id="recipes"></div>

  <footer>Protein figures are rough estimates.
  Cook eggs until the whites are firm. Heat ready-made chicken and sausages until steaming hot. Follow the dates on packaging.</footer>
</div>

const byId = Object.fromEntries(ING.map(i=>[i.id,i]));
const KEY = "recipe-finder-selection";
let sel = new Set();
try { sel = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e){}
let tab = "ready", filter = "any", query = "";
const opened = new Set();

const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...sel])); } catch(e){} };
const has = r => Array.isArray(r) ? r.some(x => sel.has(x)) : sel.has(r);
const label = r => Array.isArray(r) ? r.map(x=>byId[x].name).join(" or ") : byId[r].name;

function renderIngredients(){
  const groups = [...new Set(ING.map(i=>i.group))];
  document.getElementById("ingredients").innerHTML = groups.map(g =>
    `<div class="group">${g}</div><div class="chips">` +
    ING.filter(i=>i.group===g).map(i =>
      `<button class="chip" data-id="${i.id}" aria-pressed="${sel.has(i.id)}"><span>${i.emoji} ${i.name}${i.ro?`<small>${i.ro}</small>`:""}</span></button>`
    ).join("") + `</div>`
  ).join("");
  document.getElementById("selcount").textContent = sel.size ? sel.size + " selected" : "";
}

function renderRecipes(){
  const pass = r => (filter==="any" || (filter==="fast" && r.time<=10) || (filter==="nocook" && r.nc))
                 && (!query || r.name.toLowerCase().includes(query));
  const scored = R.map((r,i) => ({r,i, missing: r.need.filter(n => !has(n))})).filter(x => pass(x.r))
                  .sort((a,b)=> a.missing.length - b.missing.length || a.r.time - b.r.time);
  const ready  = scored.filter(x => x.missing.length === 0);
  const almost = scored.filter(x => x.missing.length > 0 && x.missing.length <= 2);
  const tabs = {ready:["Ready",ready], almost:["Almost",almost], all:["All",scored]};
  document.querySelectorAll(".tab").forEach(b => {
    b.firstChild.textContent = `${tabs[b.dataset.tab][0]} (${tabs[b.dataset.tab][1].length})`;
    b.setAttribute("aria-selected", b.dataset.tab === tab);
  });
  const list = tabs[tab][1];
  const box = document.getElementById("recipes");
  if(!list.length){
    box.innerHTML = `<div class="empty">${sel.size===0 && tab!=="all"
      ? "Tap the ingredients you have above"
      : tab==="ready" ? "Nothing fully matches yet. Check “Almost”"
      : "Nothing here"}</div>`;
    return;
  }
  box.innerHTML = list.map(({r,i,missing}) => {
    const status = missing.length === 0
      ? `<span class="status ok">Ready!</span>`
      : `<span class="status miss">Missing ${missing.length}</span>`;
    const need = r.need.map(n => `<span class="tag ${has(n)?"":"no"}">${has(n)?"✔":"✘"} ${label(n)}</span>`).join("");
    const opt = r.opt.length ? `<h4>Nice to have</h4>` + r.opt.map(o => `<span class="tag opt">${byId[o].name}</span>`).join("") : "";
    return `<details data-i="${i}" ${opened.has(i)?"open":""}>
      <summary><span class="emoji"><span>${r.emoji}</span></span>
        <div><div class="title">${r.name}</div>
        <div class="meta">⏱ ${r.time} min · 💪 ${r.protein}${r.nc?" · ❄ no cooking":""}</div></div>${status}</summary>
      <div class="body">
        <h4>Ingredients</h4>${need}${opt}
        <h4>How to make it</h4><ol>${r.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
        <div class="tip"><b>Tip:</b> ${r.tip}</div>
      </div></details>`;
  }).join("");
}

function renderAll(){ renderIngredients(); renderRecipes(); }

document.getElementById("ingredients").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if(!c) return;
  const id = c.dataset.id;
  sel.has(id) ? sel.delete(id) : sel.add(id);
  save(); renderAll();
});
document.querySelector(".tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if(!t) return;
  tab = t.dataset.tab; renderRecipes();
});
document.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b));
  renderRecipes();
}));
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); renderRecipes(); });
document.getElementById("recipes").addEventListener("toggle", e => {
  const d = e.target; if(d.tagName !== "DETAILS") return;
  const i = +d.dataset.i; d.open ? opened.add(i) : opened.delete(i);
}, true);
document.getElementById("basics").onclick = () => { sel.add("oil"); sel.add("salt"); save(); renderAll(); };
document.getElementById("clear").onclick  = () => { sel.clear(); save(); renderAll(); };

renderAll();
</script>
