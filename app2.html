<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffe500">
<title>Midnight TV</title>
<style>
:root{--y:#ffe500;--bg:#000;--tx:#fff;--mu:#9a9a9a;--red:#ff2a2a;
--noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Arial Black","Segoe UI",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;background:repeating-linear-gradient(115deg,#000 0 46px,#0b0b00 46px 92px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.it{font-style:italic;font-weight:900;text-transform:uppercase}
#static{position:fixed;inset:-60px;background:var(--noise);opacity:.07;mix-blend-mode:screen;pointer-events:none;z-index:200;animation:stat .35s steps(4) infinite}
@keyframes stat{0%{transform:translate(0,0)}25%{transform:translate(-30px,20px)}50%{transform:translate(25px,-35px)}75%{transform:translate(-15px,-10px)}100%{transform:translate(0,0)}}
#scan{position:fixed;inset:0;pointer-events:none;z-index:199;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
body.calm #static{animation:none;opacity:.03}
header{position:relative;background:var(--y);color:#000;padding:calc(env(safe-area-inset-top) + 10px) 16px 30px;clip-path:polygon(0 0,100% 0,100% 66%,0 100%);flex-shrink:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
header>div:first-child{min-width:0}
header small{display:block;font-size:11px;letter-spacing:4px;font-weight:900;transform:skewX(-10deg)}
h1{font-size:clamp(28px,9.5vw,40px);line-height:.95;letter-spacing:-1px;transform:skewX(-10deg);text-shadow:2px 2px 0 rgba(0,0,0,.25)}
.hb{display:flex;gap:6px;flex-shrink:0;margin-top:4px}
.hb button{background:#000;color:var(--y);padding:8px 11px;font-size:13px;transform:skewX(-10deg)}
main{flex:1;overflow-y:auto;padding:0 14px 170px;margin-top:-14px;position:relative}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:4px;padding:14px 6px calc(env(safe-area-inset-bottom) + 10px);z-index:20;background:linear-gradient(0deg,#000 70%,transparent)}
.tab{flex:1;padding:13px 0;background:#000;color:#fff;font-size:9.5px;letter-spacing:-.2px;white-space:nowrap;border:2px solid #333;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);transition:transform .1s}
.tab.on{background:var(--y);color:#000;border-color:var(--y);transform:translateY(-9px) scale(1.07)}
#fab{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:21;background:#fff;color:#000;font-size:14px;padding:14px 22px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);filter:drop-shadow(4px 4px 0 var(--y))}
#fab:active{background:var(--y)}
.hero{display:flex;align-items:center;gap:12px;margin:6px 0 6px}
.hero .big{font-size:96px;line-height:.9;font-style:italic;font-weight:900;color:#fff;transform:skewX(-10deg);text-shadow:5px 5px 0 var(--y);letter-spacing:-4px}
.hero .mo{font-size:26px;color:var(--y);transform:skewX(-10deg)}
.hero .wd{font-size:16px;background:#fff;color:#000;padding:2px 10px;display:inline-block;transform:skewX(-10deg);margin-top:2px}
.odchip{display:table;margin:16px 0 0;background:var(--red);color:#fff;font-size:12px;padding:7px 16px;transform:skewX(-10deg)}
.fc-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;font-size:11px;font-style:italic;font-weight:900;text-transform:uppercase;transform:skewX(-10deg);margin-bottom:8px}
.fc-chip.rain{background:#38bdf8;color:#000}
.fc-chip.fog{background:#c084fc;color:#000}
.fc-chip.sun{background:var(--y);color:#000}
.fc-chip.cloud{background:#64748b;color:#fff}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mtitle{display:flex;align-items:center;gap:8px;cursor:pointer}
.mtitle h2{font-size:20px;transform:skewX(-10deg)}
.mtitle small{color:var(--y);margin-left:6px;font-size:14px}
.tdchip{background:#000;color:var(--y);font-size:10px;padding:2px 8px;letter-spacing:1px;transform:skewX(-10deg)}
.arr{width:48px;height:38px;background:var(--y);color:#000;font-size:20px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk div{text-align:center;font-size:10px;color:var(--y);font-weight:900;text-transform:uppercase;padding:4px 0;font-style:italic}
.d{aspect-ratio:1;background:#111;border:0;color:#fff;font-size:16px;font-weight:900;font-style:italic;display:flex;flex-direction:column;align-items:center;justify-content:center;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.d.today{background:var(--y);color:#000}
.d.sel{box-shadow:inset 0 0 0 3px #fff}
.d.today.sel{box-shadow:inset 0 0 0 3px #000}
.d i{font-style:normal;font-size:9px;height:10px;line-height:10px;color:var(--y)}
.d.today i{color:#000}
.d.all i{font-size:12px}
.d.od i{color:var(--red);font-size:12px;font-weight:900}
.sub{display:table;margin:16px 2px 8px;font-size:15px;color:#000;background:var(--y);padding:3px 16px 3px 10px;transform:skewX(-12deg);font-style:italic;font-weight:900;text-transform:uppercase}
.sub.red{background:var(--red);color:#fff}
.ctl{margin-top:16px}
.sinp{position:relative;width:100%}
.sinp input{padding-right:38px}
.sclr{position:absolute;right:8px;top:10px;width:24px;height:24px;background:#222;color:#aaa;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center}
.sclr:hover{background:#333;color:#fff}
.rw{position:relative;margin-bottom:6px;touch-action:pan-y}
.hint{position:absolute;inset:0;display:none;align-items:center;font-size:15px;font-style:italic;font-weight:900;text-transform:uppercase;padding:0 24px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.hint.l{background:var(--y);color:#000;justify-content:flex-start}
.hint.r{background:var(--red);color:#fff;justify-content:flex-end}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px 12px 18px;background:linear-gradient(90deg,var(--c) 0 8px,#000 8px);clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.row.od{background:linear-gradient(90deg,var(--red) 0 8px,#1a0000 8px)}
.pip{width:32px;height:32px;border:3px solid var(--c);background:#000;transform:skewX(-12deg);font-weight:900;color:#000;font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.pip.rpn{color:var(--c);font-size:16px}
.row.done .pip{background:var(--c)}
.tx{flex:1;min-width:0}
.tt{font-size:16px;font-style:italic;font-weight:900;overflow:hidden;text-overflow:ellipsis}
.rp{color:var(--y);font-size:14px}
.tm{color:var(--y);font-weight:900;margin-right:2px}
.mm{font-size:11px;color:var(--mu);margin-top:2px;font-family:system-ui,sans-serif;font-weight:700}
.odt{color:var(--red);text-transform:uppercase}
.row.done .tt{text-decoration:line-through;opacity:.45}
.row.done .mm{opacity:.45}
.ib{width:34px;height:34px;font-size:17px;color:#bbb}
.ib.del{color:var(--red)}
.empty{text-align:center;padding:44px 20px;color:var(--mu);font-size:13px;font-style:italic}
.empty b{display:block;font-size:46px;color:var(--y);transform:skewX(-10deg);margin-bottom:4px}
.card{position:relative;overflow:hidden;padding:16px 18px;margin-bottom:10px;background:linear-gradient(90deg,var(--c) 0 10px,#000 10px);clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%);display:block;width:100%;text-align:left}
.card h3{font-size:22px;color:var(--c);transform:skewX(-10deg);position:relative}
.card .lvn{position:absolute;right:20px;top:-6px;font-size:84px;font-style:italic;font-weight:900;color:transparent;-webkit-text-stroke:2px var(--c);opacity:.8;line-height:1}
.card .lvl{font-size:11px;position:relative;color:#fff;font-style:italic}
.bar{height:14px;background:#262626;margin:14px 0 6px;transform:skewX(-24deg);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--c);width:0;transition:width .9s cubic-bezier(.3,.7,.2,1)}
.nums{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);font-variant-numeric:tabular-nums;position:relative;font-family:system-ui,sans-serif;font-weight:700}
.swell{animation:swell .9s ease}
@keyframes swell{40%{transform:scale(1.05)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:9px 16px;background:#1a1a1a;font-size:13px;font-style:italic;font-weight:900;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.chip.sel{background:var(--c,var(--y));color:#000}
.sw{width:40px;height:40px;background:var(--c);border:3px solid #000;transform:skewX(-12deg);outline:2px solid transparent}
.sw.sel{outline-color:#fff}
.note{display:block;width:100%;text-align:left;padding:14px 18px;margin-bottom:6px;background:linear-gradient(90deg,#fff 0 8px,#000 8px);clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.note b{display:block;font-size:16px;font-style:italic}
.note span{display:block;font-size:12px;color:var(--mu);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:system-ui,sans-serif;font-weight:700}
.ncheck{color:var(--y);font-weight:900}
/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.tile{background:#000;padding:10px 14px 10px 20px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);border-left:8px solid var(--y)}
.tile b{display:block;font-size:32px;font-style:italic;color:#fff;text-shadow:3px 3px 0 var(--y)}
.tile span{font-size:10px;letter-spacing:2px;color:var(--mu);text-transform:uppercase;font-style:italic}
.heat{display:grid;grid-template-columns:repeat(16,1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px;background:#000;padding:10px}
.hc{aspect-ratio:1;background:#161616}
.hc.h1{background:#5c5100}.hc.h2{background:#a89500}.hc.h3{background:var(--y)}
.hc.fut{opacity:.25}.hc.td{outline:2px solid #fff}
.lg{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:10px;color:var(--mu);margin-top:6px;font-family:system-ui,sans-serif;font-weight:700}
.lg i{width:12px;height:12px;display:block}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;background:#000;padding:10px 10px 6px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mu);font-family:system-ui,sans-serif;font-weight:700}
.bc i{display:block;width:100%;background:var(--y);transform:skewX(-10deg)}
.bc em{font-style:normal;color:#fff;font-size:11px;margin-bottom:3px}
.bc span{margin-top:4px}
.bc.cur i{background:#fff}
.cat{background:#000;padding:12px 16px 8px 20px;margin-bottom:6px;border-left:8px solid var(--c);clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.cat .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cat b{color:var(--c);font-size:17px}
.cat span{font-size:11px;color:#fff;font-style:italic}
.cat .bar{margin:8px 0 4px}
.top{color:var(--y);font-size:11px;letter-spacing:2px}
/* sheets */
.ov{position:fixed;inset:0;z-index:50}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.75);opacity:0;transition:opacity .25s}
.ov.on .bd{opacity:1}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:#050505;border-top:6px solid var(--y);padding:22px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.ov.on .sh{transform:none}
.sh h2{font-size:26px;color:var(--y);transform:skewX(-10deg);margin-bottom:14px;text-shadow:3px 3px 0 #333}
label{display:block;font-size:11px;font-weight:900;color:var(--y);text-transform:uppercase;letter-spacing:2px;margin:4px 0 6px;font-style:italic}
input,textarea{width:100%;background:#111;color:#fff;border:3px solid #2a2a2a;padding:12px;font:inherit;font-family:system-ui,sans-serif;font-weight:700;font-size:16px;margin-bottom:12px;color-scheme:dark;border-radius:0}
input:focus,textarea:focus{outline:0;border-color:var(--y)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--y);margin:8px 0 12px}
textarea{min-height:160px;resize:vertical}
.btns{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:14px;font-size:14px;background:var(--y);color:#000;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.btn.ghost{background:#222;color:#fff}
.btn.red{background:var(--red);color:#fff}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #222}
.srow.col{display:block}
.sl{font-size:14px;font-style:italic;text-transform:uppercase}
.ss{font-size:11px;color:var(--mu);font-family:system-ui,sans-serif;font-weight:700;margin-top:2px}
.tg{min-width:64px;padding:8px 12px;background:#222;color:#888;font-size:12px;font-style:italic;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.tg.on{background:var(--y);color:#000}
.dlg{display:flex;align-items:center;justify-content:center;padding:24px}
.box{position:relative;background:#140000;border:3px solid var(--red);padding:22px;width:100%;max-width:340px;transform:scale(.9) skewX(-3deg);opacity:0;transition:.2s}
.dlg.on .box{transform:skewX(-3deg);opacity:1}
.box p{margin:10px 0 16px;font-size:15px;font-style:italic}
.warn{width:36px;height:36px;background:var(--red);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;transform:skewX(-12deg)}
/* undo bar */
#undo{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 140px);z-index:45;background:#fff;color:#000;display:flex;align-items:center;gap:10px;padding:9px 10px 9px 18px;transform:translateY(400%) skewX(-6deg);transition:transform .25s cubic-bezier(.2,1.2,.4,1);pointer-events:none}
#undo.show{transform:skewX(-6deg);pointer-events:auto}
#um{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-style:italic;font-weight:900}
#ub{background:#000;color:var(--y);padding:8px 14px;font-size:12px}
/* reward + effects */
#reward{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:30;background:#000;border:3px solid var(--y);padding:10px 16px;transform:translateY(220%) skewX(-4deg);transition:transform .25s cubic-bezier(.2,1.2,.4,1);pointer-events:none}
#reward.show{transform:skewX(-4deg)}
#reward .rn{font-size:13px;font-style:italic;font-weight:900;text-transform:uppercase}
#reward .rc{font-size:11px;color:var(--mu);text-align:right;font-variant-numeric:tabular-nums;font-family:system-ui,sans-serif;font-weight:700}
#reward .rb{height:10px;background:#262626;margin:6px 0 4px;transform:skewX(-24deg);overflow:hidden}
#reward i{display:block;height:100%;width:0}
.rankup{position:fixed;inset:0;z-index:160;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;opacity:0;animation:ruin .2s forwards}
@keyframes ruin{to{opacity:1}}
@keyframes ruout{from{opacity:1}to{opacity:0}}
.rankup .rs{position:absolute;inset:-60% -30%;background:repeating-linear-gradient(115deg,var(--c) 0 46px,#000 46px 130px);opacity:.28;animation:rsl 3.6s linear forwards}
body.calm .rankup .rs{animation:none}
@keyframes rsl{to{transform:translateX(-320px)}}
.rt{position:relative;text-align:center;transform:skewY(-6deg);padding:0 10px}
.rt>div{opacity:0;animation:slam .45s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes slam{from{opacity:0;transform:translateX(-120%) scale(1.5)}to{opacity:1;transform:none}}
.r1{font-size:clamp(44px,15vw,74px);color:var(--y);text-shadow:4px 4px 0 #fff;animation-delay:.1s!important}
.r2{font-size:clamp(28px,9vw,50px);color:var(--c);animation-delay:.3s!important}
.r3{font-size:clamp(110px,38vw,190px);line-height:.95;color:var(--c);text-shadow:7px 7px 0 #fff;animation-delay:.5s!important}
.r4{display:inline-block;background:#fff;color:#000;padding:6px 24px;font-size:20px;transform:skewX(-12deg);animation-delay:.8s!important}
.bn{position:fixed;z-index:120;pointer-events:none;filter:drop-shadow(7px 7px 0 rgba(0,0,0,.85))}
.bn svg{width:100%;height:auto;display:block;overflow:visible}
.flash{position:fixed;inset:0;background:var(--y);z-index:110;pointer-events:none}
.stamp{position:fixed;left:-10%;right:-10%;top:40%;z-index:130;pointer-events:none;background:#000;color:var(--y);text-align:center;font-size:44px;padding:8px 0;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:2px;border-top:5px solid var(--y);border-bottom:5px solid var(--y);text-shadow:4px 4px 0 #fff}
.stamp small{display:block;font-size:16px;color:#fff;letter-spacing:3px;text-shadow:none;margin-top:2px}
.scrub{animation:scr .25s}
@keyframes scr{from{opacity:.2;transform:translateX(var(--dx))}}
/* boot */
#boot{position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
#boot .bs{position:absolute;inset:-60px;background:var(--noise);mix-blend-mode:screen;animation:stat .2s steps(3) infinite,bfade 1.6s forwards}
body.calm #boot .bs{animation:bfade 1.2s forwards}
@keyframes bfade{from{opacity:1}to{opacity:.12}}
#boot .crt{position:absolute;inset:0;background:#fff;animation:crt .85s cubic-bezier(.7,0,.3,1) forwards}
@keyframes crt{0%{transform:scaleX(0) scaleY(.006);opacity:1}35%{transform:scaleX(1) scaleY(.006)}70%{transform:scaleX(1) scaleY(1);opacity:1}100%{transform:scaleX(1) scaleY(1);opacity:0}}
#boot .b1,#boot .b2,#boot .b3{position:relative;opacity:0;animation:bin .35s cubic-bezier(.2,1.4,.4,1) forwards}
#boot .b1{font-size:clamp(46px,16vw,80px);color:var(--y);text-shadow:5px 5px 0 #fff;transform:skewX(-10deg);animation-delay:.9s}
#boot .b2{font-size:38px;background:var(--y);color:#000;padding:0 28px;transform:skewX(-10deg);animation-delay:1.1s}
#boot .b3{font-size:13px;letter-spacing:5px;margin-top:26px;animation:blink 1.1s ease-in-out 1.6s infinite backwards}
@keyframes bin{from{opacity:0;transform:translateY(20px) skewX(-10deg) scale(1.3)}to{opacity:1;transform:skewX(-10deg)}}
@keyframes blink{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<header>
 <div><small class="it">Midnight TV</small><h1 class="it" id="ttl"></h1></div>
 <div class="hb">
   <button id="strk" class="it" data-a="tab" data-id="stats" aria-label="Streak and stats">🔥 0</button>
   <button id="gear" data-a="settings" aria-label="Settings">⚙</button>
 </div>
</header>
<main id="main"></main>
<button id="fab" class="it" data-a="fab"></button>
<div id="undo"><span id="um"></span><button id="ub" class="it" data-a="undo" aria-label="Undo action">Undo</button></div>
<div id="reward"><div class="rn"></div><div class="rb"><i></i></div><div class="rc"></div></div>
<nav>
  <button class="tab it" data-a="tab" data-id="cal">Calendar</button>
  <button class="tab it" data-a="tab" data-id="tasks">Tasks</button>
  <button class="tab it" data-a="tab" data-id="levels">Levels</button>
  <button class="tab it" data-a="tab" data-id="notes">Notes</button>
  <button class="tab it" data-a="tab" data-id="stats">Stats</button>
</nav>
<div id="boot" class="it"><div class="bs"></div><div class="crt"></div><div class="b1">Midnight</div><div class="b2">TV</div><div class="b3">Tap to enter</div></div>
<div id="scan"></div><div id="static"></div>

<script>
const $=s=>document.querySelector(s);
const KEY='midnight-tv-v1',COMBO=20;
const DIFF={e:{n:'Easy',xp:10},m:{n:'Medium',xp:20},h:{n:'Hard',xp:30}};
const COLORS=['#ffe500','#4ade80','#60a5fa','#f472b6','#fb923c','#a78bfa','#2dd4bf','#f87171'];

/* ---------- forecast mechanics ---------- */
function getForecast(ds){
 const d=parse(ds);
 const code=(d.getFullYear()*12+d.getMonth()*31+d.getDate())%7;
 if(code===0||code===4)return{type:'rain',label:'Rainy Day',icon:'🌧️',bonus:1.5,desc:'+50% XP Boost'};
 if(code===6)return{type:'fog',label:'Heavy Fog',icon:'🌫️',bonus:2.0,desc:'Double XP Mystery'};
 if(code===2)return{type:'cloud',label:'Cloudy',icon:'☁️',bonus:1.0,desc:'Normal XP'};
 return{type:'sun',label:'Clear Skies',icon:'☀️',bonus:1.0,desc:'Normal XP'};
}

function migrate(s){

 s.tasks.forEach(t=>{
  if(!t.comp||typeof t.comp!=='object'){t.comp={};if(t.done)t.comp[t.date]=t.date}
  delete t.done;
  if(!DIFF[t.diff])t.diff='e';
  if(t.rep===undefined)t.rep=null;
  if(t.time===undefined)t.time=null;
 });
 s.notes.forEach(n=>{

 });

 for(const k in D)if(s[k]===undefined)s[k]=D[k];
 return s;
}

/* ---------- tasks / occurrences ---------- */
function occurs(t,ds){
 if(!t.rep)return t.date===ds;
 if(ds<t.date)return false;
 if(t.rep.type==='daily')return true;
 if(t.rep.type==='weekly')return dow(ds)===dow(t.date);
 if(t.rep.type==='days')return t.rep.days.includes(dow(ds));
 return false;
}
const occ=ds=>S.tasks.filter(t=>occurs(t,ds)).sort(taskSort).map(t=>({t,ds,done:!!t.comp[ds]}));
const isOd=(t,ds,done)=>!t.rep&&!done&&ds<todayStr();
const overdueCount=()=>S.tasks.filter(t=>!t.rep&&!t.comp[t.date]&&t.date<todayStr()).length;
function ruleText(t){
 const r=t.rep;if(!r)return'';
 if(r.type==='daily')return'Every day';
 if(r.type==='weekly')return'Every '+DAYN[dow(t.date)];
 return[1,2,3,4,5,6,0].filter(d=>r.days.includes(d)).map(d=>DAYN[d]).join(', ');
}
function taskSort(a,b){
 const tA=a.t||a, tB=b.t||b;
 if(tA.time&&tB.time)return tA.time.localeCompare(tB.time);
 if(tA.time)return-1;if(tB.time)return 1;
 return (tA.title||'').localeCompare(tB.title||'');
}

/* ---------- levels / xp / streaks ---------- */
const getLv=id=>S.levels.find(l=>l.id===id);
function xpOf(id){
 if(!id)return 0;let x=0;
 for(const t of S.tasks){
  if(t.levelId===id){
   for(const ds in t.comp){
    const fc=getForecast(ds);
    x+=Math.round(DIFF[t.diff].xp*(fc?fc.bonus:1));
   }
  }
 }
 for(const k in S.bonus)if(S.bonus[k]===id)x+=COMBO;
 return x;
}
function lvInfo(xp){let l=1,need=50;while(xp>=need){xp-=need;l++;need+=25}return{l,cur:xp,need,pct:xp/need*100}}
function syncCombo(ds,lvId){
 const o=occ(ds),full=o.length>=2&&o.every(x=>x.done);
 if(full&&S.bonus[ds]===undefined){S.bonus[ds]=lvId||'';return true}
 if(!full&&S.bonus[ds]!==undefined)delete S.bonus[ds];
 return false;
}
function streaks(){
 const set=new Set();S.tasks.forEach(t=>{for(const k in t.comp)set.add(t.comp[k])});
 let cur=0;const d=new Date();
 if(!set.has(ymd(d)))d.setDate(d.getDate()-1);
 while(set.has(ymd(d))){cur++;d.setDate(d.getDate()-1)}
 let best=0,run=0,prev=null;
 for(const s of[...set].sort()){
  if(prev&&Math.round((parse(s)-parse(prev))/864e5)===1)run++;else run=1;
  if(run>best)best=run;prev=s;
 }
 return{cur,best};
}

/* ---------- audio with master dynamics compressor ---------- */
let AC,MG,MUS,NB;
function ctx(){
 if(!AC){
  AC=new(window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor();
  comp.threshold.setValueAtTime(-14,AC.currentTime);
  comp.knee.setValueAtTime(12,AC.currentTime);
  comp.ratio.setValueAtTime(10,AC.currentTime);
  comp.attack.setValueAtTime(0.003,AC.currentTime);
  comp.release.setValueAtTime(0.12,AC.currentTime);
  comp.connect(AC.destination);
  
  MG=AC.createGain();MG.gain.value=S.vol/100;MG.connect(comp);
  MUS=AC.createGain();MUS.gain.value=.42;MUS.connect(MG);
  NB=AC.createBuffer(1,Math.floor(AC.sampleRate*.2),AC.sampleRate);
  const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;
 }
 if(AC.state==='suspended')AC.resume();
 return AC;
}
function osc(f,d,type,v,t,slide,dest){
 const o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);g.connect(dest||MG);o.start(t);o.stop(t+d+.02);
}
function tone(f,d=.1,type='square',v=.04,t0=0,slide){
 if(!S.sound)return;
 try{ctx();osc(f,d,type,v,AC.currentTime+t0,slide)}catch(e){}
}
function hat(t,v){
 const s=AC.createBufferSource();s.buffer=NB;
 const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7000;
 const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);
 s.connect(f);f.connect(g);g.connect(MUS);s.start(t);s.stop(t+.06);
}
const PENT=[784,880,1047,1175,1319,1568];
const sfx={
 tick:()=>tone(1100,.03,'square',.02),
 tap:()=>tone(520,.05,'triangle',.05),
 tab:()=>{tone(300,.05,'square',.04);tone(880,.18,'sawtooth',.04,.05)},
 check:()=>{tone(1200,.04,'square',.07);[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.14,'square',.04,.06+i*.07))},
 uncheck:()=>tone(300,.18,'triangle',.06,0,120),
 fan:()=>{[392,523,659].forEach((f,i)=>tone(f,.28,'sawtooth',.06,i*.14));tone(784,.7,'square',.04,.45)},
 whoosh:()=>tone(900,.3,'sawtooth',.02,0,200),
 dead:()=>tone(110,.1,'square',.04),
 warn:()=>tone(150,.4,'sawtooth',.04,0,140),
 snip:()=>tone(1500,.04,'square',.05),
 scrub:()=>tone(300,.2,'sawtooth',.02,0,1200),

};

/* background music: lookahead step sequencer */
const BPM=118,STEP=60/BPM/2;
const MR=[57,53,60,55],MQ=[[0,3,7,12],[0,4,7,12],[0,4,7,12],[0,4,7,12]];
const LP=[[0,-1,2,1,-1,2,3,1],[3,2,-1,2,1,2,3,-1]];
const mus={on:false,step:0,next:0,timer:null};
const mtof=m=>440*2**((m-69)/12);
function playStep(s,t){
 const bar=(s>>3)&3,st=s&7,half=s>>5,root=MR[bar],ch=MQ[bar];
 if(st%2===0)osc(mtof(root-12+(st===6?7:0)),STEP*1.8,'triangle',.18,t,0,MUS);
 if(st===0||st===4)osc(140,.12,'sine',.3,t,40,MUS);
 if(st%2===1)hat(t,.05);
 if(st===4)hat(t,.09);
 const k=LP[half][st];
 if(k>=0)osc(mtof(root+12+ch[k]),STEP*.9,'square',.035,t,0,MUS);
}
function musTick(){
 if(!mus.on||!AC)return;
 if(mus.next<AC.currentTime-.2)mus.next=AC.currentTime+.05;
 while(mus.next<AC.currentTime+.3){playStep(mus.step,mus.next);mus.next+=STEP;mus.step=(mus.step+1)%64}
}
function startMusic(){
 if(!S.music||mus.on)return;
 try{ctx();mus.on=true;mus.next=AC.currentTime+.05;mus.step=0;mus.timer=setInterval(musTick,80)}catch(e){mus.on=false}
}
function stopMusic(){mus.on=false;clearInterval(mus.timer);mus.timer=null}
function applySettings(){
 document.body.classList.toggle('calm',!!S.calm);
 if(MG)MG.gain.value=S.vol/100;
 if(S.music)startMusic();else stopMusic();
}
addEventListener('pointerdown',()=>{if(S.music&&!mus.on&&bootDone)startMusic()},{passive:true});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){stopMusic();if(AC&&AC.state==='running')AC.suspend()}
 else if(S.music&&bootDone){if(AC)AC.resume();startMusic()}
});

function matches(t){
 const q=ui.q.trim().toLowerCase();
 if(ui.lf&&t.levelId!==ui.lf)return false;
 return !q||t.title.toLowerCase().includes(q);
}
function tasksList(){
 if(!S.tasks.length)return emptyHtml('No tasks yet. Add one!');
 const ts=todayStr(),L=S.tasks.filter(matches);
 const od=L.filter(t=>!t.rep&&!t.comp[t.date]&&t.date<ts).sort(taskSort).map(t=>({t,ds:t.date,done:false}));
 const td=L.filter(t=>occurs(t,ts)).sort(taskSort).map(t=>({t,ds:ts,done:!!t.comp[ts]}));
 const up=L.filter(t=>!t.rep&&t.date>ts&&!t.comp[t.date]).sort(taskSort).map(t=>({t,ds:t.date,done:false}));
 const rp=L.filter(t=>t.rep);
 const dn=L.filter(t=>!t.rep&&t.comp[t.date]&&t.date!==ts).sort((a,b)=>t2(b).localeCompare(t2(a))).slice(0,15).map(t=>({t,ds:t.date,done:true}));
 function t2(t){return t.comp[t.date]||''}
 let h='';
 if(od.length)h+=sec('Overdue',od.length,'red')+od.map(rowHtml).join('');
 if(td.length)h+=sec('Today',td.length)+td.map(rowHtml).join('');
 if(up.length)h+=sec('Upcoming',up.length)+up.map(rowHtml).join('');
 if(rp.length)h+=sec('Repeating',rp.length)+rp.map(tplHtml).join('');
 if(dn.length)h+=sec('Done',dn.length)+dn.map(rowHtml).join('');
 return h||emptyHtml('Nothing matches');
}

const stack=[];
function sheet(html,mount){
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="bd"></div><div class="sh">${html}</div>`;
 document.body.appendChild(o);stack.push(o);sfx.open();
 o.querySelector('.bd').onclick=()=>close(o);
 requestAnimationFrame(()=>o.classList.add('on'));
 mount&&mount(o);return o;
}
function close(o){o=o||stack[stack.length-1];if(!o)return;
 const i=stack.indexOf(o);if(i>-1)stack.splice(i,1);
 o.classList.remove('on');setTimeout(()=>o.remove(),280)}
const closeAll=()=>[...stack].forEach(close);
function confirmBox(msg,yes,label='Delete'){
 const o=document.createElement('div');o.className='ov dlg';
 o.innerHTML=`<div class="bd"></div><div class="box"><div class="warn">!</div><p>${msg}</p><div class="btns"><button class="btn ghost it" data-c>Cancel</button><button class="btn red it" data-y>${label}</button></div></div>`;
 document.body.appendChild(o);stack.push(o);sfx.warn();
 requestAnimationFrame(()=>o.classList.add('on'));
 o.querySelector('[data-c]').onclick=o.querySelector('.bd').onclick=()=>close(o);
 o.querySelector('[data-y]').onclick=()=>{sfx.snip();close(o);yes()};
}

function offerUndo(snap,msg){
 undoSnap=snap;$('#um').textContent=msg;$('#ub').style.display=snap?'':'none';

function notesBurst(x,y,extras){
 const W=innerWidth,H=innerHeight;
 if(!S.calm){
  const styles=[['#ffe500','#000'],['#ffffff','#000'],['#000000','#ffe500'],['#ffe500','#000'],['#ffffff','#000']];
  for(let i=0;i<10;i++){
   const size=150+Math.random()*190,s=styles[i%styles.length];
   const left=Math.random()*(W-size*.7)-size*.15,top=H*.05+Math.random()*(H*.75)-size*.3;
   const el=document.createElement('div');el.className='bn';
   el.style.cssText=`width:${size}px;left:${left}px;top:${top}px`;
   el.innerHTML=noteSvg(i%3===2?1:0,s[0],s[1]);
   document.body.appendChild(el);
   const sx=x-(left+size/2),sy=y-(top+size*.5),r=(Math.random()*70-35);
   el.animate([
    {transform:`translate(${sx}px,${sy}px) scale(.08) rotate(0deg)`,opacity:1},
    {transform:`translate(0,0) scale(1.18) rotate(${r}deg)`,opacity:1,offset:.28},
    {transform:`translate(0,0) scale(1) rotate(${r*.55}deg)`,opacity:1,offset:.72},
    {transform:`translate(0,-140px) scale(1.35) rotate(${r}deg)`,opacity:0}
   ],{duration:1600+Math.random()*500,delay:i*55,easing:'cubic-bezier(.2,.9,.3,1)',fill:'both'}).onfinish=()=>el.remove();
  }
  const f=document.createElement('div');f.className='flash';document.body.appendChild(f);
  f.animate([{opacity:.55},{opacity:0}],{duration:380}).onfinish=()=>f.remove();
 }
 const st=document.createElement('div');st.className='stamp';
 st.innerHTML='Task clear!'+extras.map(e=>`<small>${e}</small>`).join('');
 document.body.appendChild(st);
 st.animate([
  {transform:'translateX(-120%) skewY(-6deg)'},
  {transform:'translateX(0) skewY(-6deg)',offset:.18},
  {transform:'translateX(0) skewY(-6deg)',offset:.78},
  {transform:'translateX(120%) skewY(-6deg)'}
 ],{duration:S.calm?1000:(extras.length?1900:1400),easing:'ease-out'}).onfinish=()=>st.remove();
 vib([20,30,40]);
}

  const iv=setInterval(()=>{if(my!==rt)return clearInterval(iv);v+=v<to?1:-1;cnt.textContent=`${v} / ${need} XP`;sfx.tick();if(v===to)clearInterval(iv)},40)};

function toggleOcc(id,ds,el){
 const t=S.tasks.find(x=>x.id===id);if(!t)return;
 const r=el.getBoundingClientRect(),l=getLv(t.levelId),before=xpOf(t.levelId),sb=streaks().cur,was=!!t.comp[ds];
 if(was)delete t.comp[ds];else t.comp[ds]=todayStr();
 const combo=syncCombo(ds,t.levelId),after=xpOf(t.levelId);
 save();
 if(!was){
  const extras=[],sa=streaks().cur,fc=getForecast(ds);
  if(fc.bonus>1)extras.push(`${fc.icon} ${fc.label} +${Math.round((fc.bonus-1)*100)}% XP`);
  if(sa>sb)extras.push(`🔥 Day ${sa} streak`);
  if(combo)extras.push(`All clear · +${COMBO} XP`);
  sfx.check();if(combo)setTimeout(sfx.fan,500);
  notesBurst(r.left+r.width/2,r.top+r.height/2,extras);
 }else sfx.uncheck();
 render();
 if(l)setTimeout(()=>reward(l,before,after),was?60:750);
}

 editTask(id){const t=S.tasks.find(x=>x.id===id);if(t)taskSheet(t)},
 delTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const snap=snapshot();S.tasks=S.tasks.filter(x=>x!==t);save();render();sfx.snip();
  offerUndo(snap,`Deleted “${t.title}”`);
 },
 undo(){
  if(!undoSnap)return;
  const keep={};['sound','music','vol','vib','calm','boot'].forEach(k=>keep[k]=S[k]);
  S=migrate(JSON.parse(undoSnap));Object.assign(S,keep);
  undoSnap=null;$('#undo').classList.remove('show');
  if(!S.sections.find(s=>s.id===ui.sec))ui.sec=S.sections[0].id;
  save();render();sfx.tab();
 },
 lf(id){ui.lf=id||'';sfx.tick();render()},
 lvl(id){sfx.tap();levelDetail(getLv(id))},
 sec(id){ui.sec=id;sfx.tap();render()},
 addSec(){sectionSheet()},
 editSec(){sectionSheet(S.sections.find(s=>s.id===ui.sec))},
 note(id){noteSheet(S.notes.find(n=>n.id===id))},
 settings(){sfx.tap();settingsSheet()},
 clrQ(){ui.q='';render()},
 clrNQ(){ui.nq='';render()}
};
let swipedAt=0;
document.addEventListener('click',e=>{
 if(Date.now()-swipedAt<350)return;
 const el=e.target.closest('[data-a]');if(!el)return;
 act[el.dataset.a]&&act[el.dataset.a](el.dataset.id,el,e);
});
document.addEventListener('input',e=>{
 if(e.target.id==='q'){ui.q=e.target.value;const l=$('#tlist');if(l)l.innerHTML=tasksList()}
 else if(e.target.id==='nq'){ui.nq=e.target.value;const l=$('#nlist');if(l)l.innerHTML=notesList()}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&stack.length){e.preventDefault();close()}
 if(e.key==='Enter'&&(e.target.id==='f-t'||e.target.id==='f-n')){
  e.preventDefault();const s=$('#f-s');if(s)s.click();
 }
});

/* swipe with touch target protections */
const mainEl=$('#main');let sx=null,sw=null;
mainEl.addEventListener('touchstart',e=>{
 if(e.target.closest('button, input, textarea, a')){sw=null;sx=null;return}
 const rw=e.target.closest('.rw[data-sw]'),t0=e.touches[0];
 if(rw){sw={rw,row:rw.querySelector('.row'),x:t0.clientX,y:t0.clientY,dx:0,on:false};sx=null}
 else{sw=null;sx=ui.tab==='cal'?t0.clientX:null}
},{passive:true});
mainEl.addEventListener('touchmove',e=>{
 if(!sw)return;
 const t0=e.touches[0],dx=t0.clientX-sw.x,dy=t0.clientY-sw.y;
 if(!sw.on){
  if(Math.abs(dx)>15&&Math.abs(dx)>Math.abs(dy)*1.6)sw.on=true;
  else{if(Math.abs(dy)>12)sw=null;return}
 }
 e.preventDefault();sw.dx=dx;sw.row.style.transform=`translateX(${dx}px)`;
 const hl=sw.rw.querySelector('.hint.l'),hr=sw.rw.querySelector('.hint.r');
 hl.style.display=dx>0?'flex':'none';hr.style.display=dx<0?'flex':'none';
},{passive:false});
mainEl.addEventListener('touchend',e=>{
 if(sw){
  const s=sw;sw=null;if(!s.on)return;
  swipedAt=Date.now();s.row.style.transform='';
  if(s.dx>80)act.toggle(s.rw.dataset.id,s.rw.querySelector('.pip'));
  else if(s.dx<-120)act.delTask(s.rw.dataset.id);
  else s.rw.querySelectorAll('.hint').forEach(h=>h.style.display='');
  return;
 }
 if(sx===null)return;
 const dx=e.changedTouches[0].clientX-sx;sx=null;
 if(Math.abs(dx)>70)shiftMonth(dx<0?1:-1);
});
mainEl.addEventListener('touchcancel',()=>{if(sw){sw.row.style.transform='';sw=null}});

/* Android back: close sheets first, then go to Calendar, never exit */
history.replaceState({g:0},'');history.pushState({g:1},'');
addEventListener('popstate',()=>{
 if(stack.length)close();
 else if(ui.tab!=='cal'){ui.tab='cal';render()}
 history.pushState({g:1},'');
});

/* ---------- boot ---------- */
let bootDone=false;
(function(){
 const b=$('#boot');
 if(!S.boot){b.remove();bootDone=true;return}
 b.onclick=()=>{
  if(bootDone)return;bootDone=true;
  sfx.boot();startMusic();
  b.style.transition='opacity .25s,transform .25s';b.style.opacity='0';b.style.transform='scale(1.15)';
  setTimeout(()=>b.remove(),280);
 };
})();

render();
</script>
</body>
</html>
